<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شبیه‌سازی ۳ بعدی فروشگاه و سبد خرید</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050814; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; }
    
    .ui-sidebar { position: absolute; top: 15px; right: 15px; z-index: 10; width: 250px; display: flex; flex-direction: column; gap: 8px; }
    .ui-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; }
    .panel-header { display: flex; justify-content: space-between; cursor: pointer; font-size: 12px; font-weight: bold; color: #38bdf8; }
    .panel-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; font-size: 11px; color: #cbd5e1; }
    .ui-panel.open .panel-content { max-height: 250px; margin-top: 8px; }
    .btn { width: 100%; padding: 6px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; margin-top: 6px; font-weight: bold; }
    .hotspot-item { padding: 5px; background: rgba(255,255,255,0.05); margin-bottom: 4px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    /* Shopping Cart & Popups */
    .cart-widget { position: absolute; bottom: 15px; left: 15px; z-index: 10; background: rgba(15, 23, 42, 0.95); border: 1px solid #10b981; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #10b981; font-weight: bold; display: flex; gap: 10px; align-items: center; }
    .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; background: rgba(15, 23, 42, 0.98); border: 1px solid #38bdf8; border-radius: 12px; padding: 16px; width: 280px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal h3 { color: #38bdf8; font-size: 14px; margin-bottom: 6px; }
    .modal p { font-size: 11px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.4; }
    .modal .price { font-size: 13px; color: #10b981; font-weight: bold; margin-bottom: 10px; }
    .close-btn { position: absolute; top: 6px; left: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- UI Sidebar Right -->
  <div class="ui-sidebar">
    <div class="ui-panel open">
      <div class="panel-header" onclick="this.parentElement.classList.toggle('open')">
        <span>🛒 شبیه‌ساز رفتار مشتری</span>
        <span>▼</span>
      </div>
      <div class="panel-content">
        <p>ارائه تحلیل بصری و خرید تعاملی</p>
        <button class="btn" id="tour-btn" onclick="toggleTour()">▶ تور خودکار ارائه</button>
      </div>
    </div>
    <div class="ui-panel">
      <div class="panel-header" onclick="this.parentElement.classList.toggle('open')">
        <span>🎯 نقاط تحلیل (Hotspots)</span>
        <span>▼</span>
      </div>
      <div class="panel-content">
        <div class="hotspot-item" onclick="focusHotspot(0)">۱. خریدهای هیجانی (ورودی)</div>
        <div class="hotspot-item" onclick="focusHotspot(1)">۲. قفسه آرایشی (دید چشم)</div>
        <div class="hotspot-item" onclick="focusHotspot(2)">۳. قفسه خوراکی و کنسرو</div>
        <div class="hotspot-item" onclick="focusHotspot(3)">۴. منطقه صندوق</div>
      </div>
    </div>
  </div>

  <!-- Shopping Cart Widget -->
  <div class="cart-widget">
    <span>🛍️ سبد خرید: <span id="cart-count">۰</span> کالا</span>
    <span>|</span>
    <span>مجموع: <span id="cart-total">۰</span> هزار تومان</span>
  </div>

  <!-- Product Modal -->
  <div class="modal" id="prod-modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3 id="m-title">نام محصول</h3>
    <p id="m-desc">توضیحات مربوط به برجسته‌سازی بصری و جایگاه محصول...</p>
    <div class="price" id="m-price">قیمت: ۵۰,۰۰۰ تومان</div>
    <button class="btn" style="background:#10b981;" onclick="addToCart()">🛒 افزودن به سبد خرید</button>
  </div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1);
    mainLight.position.set(10, 15, 8);
    scene.add(mainLight);

    // Floor & Grid
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 24), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(24, 24, 0x38bdf8, 0x334155));

    const clickables = [];

    // Left Shelf: Cosmetics (شامپو و کرم)
    function buildCosmeticsShelf(x, z) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x334155 }));
      base.position.y = 1.1;
      g.add(base);

      // Shampoo Bottles (Cylinders)
      for(let r = -1.5; r <= 1.5; r += 0.5) {
        const bottle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.12, 0.4, 16),
          new THREE.MeshStandardMaterial({ color: 0xec4899 })
        );
        bottle.position.set(0.6, 1.45, r); // Eye Level (Golden Shelf)
        bottle.userData = { name: "شامپو تقویتی (محصول ویژه)", price: 85, desc: "چیدمان در سطح دید چشم (قفسه طلایی) باعث افزایش ۶۰٪ شانس انتخاب توسط مشتری می‌شود." };
        g.add(bottle);
        clickables.push(bottle);
      }

      // Cream Boxes (Boxes)
      for(let r = -1.5; r <= 1.5; r += 0.6) {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(0.25, 0.25, 0.25),
          new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
        );
        box.position.set(0.6, 0.95, r);
        box.userData = { name: "کرم مرطوب‌کننده", price: 45, desc: "قرارگیری در قفسه پایینی با بسته بندی روشن جهت حفظ کشش بصری." };
        g.add(box);
        clickables.push(box);
      }
      g.position.set(x, 0, z);
      scene.add(g);
    }

    // Right Shelf: Groceries (کنسرو و نوشیدنی)
    function buildGroceryShelf(x, z) {
      const g = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0x334155 }));
      base.position.y = 1.1;
      g.add(base);

      // Cans (Cylinders)
      for(let r = -1.5; r <= 1.5; r += 0.5) {
        const can = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.14, 0.3, 16),
          new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.6 })
        );
        can.position.set(-0.6, 1.4, r);
        can.userData = { name: "قوطی کنسرو (رنگ قرمز اشتهاآور)", price: 35, desc: "استفاده از رنگ‌های گرم مثل قرمز ترغیب‌کننده تصمیم‌گیری سریع و خریدهای هیجانی است." };
        g.add(can);
        clickables.push(can);
      }
      g.position.set(x, 0, z);
      scene.add(g);
    }

    buildCosmeticsShelf(-4, 0);
    buildGroceryShelf(4, 0);

    // Hotspots
    const hotspotsData = [
      { pos: {x:0, y:1.5, z:9}, title: "۱. خریدهای هیجانی", desc: "ورودی فروشگاه" },
      { pos: {x:-3.2, y:1.5, z:0}, title: "۲. قفسه لوازم آرایشی", desc: "قفسه طلایی سطح چشم" },
      { pos: {x:3.2, y:1.4, z:0}, title: "۳. قفسه خوراکی‌ها", desc: "استفاده از محرک‌های رنگی" },
      { pos: {x:0, y:1.5, z:5}, title: "۴. منطقه صندوق", desc: "خریدهای لحظه آخر" }
    ];

    hotspotsData.forEach(d => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true }));
      m.position.set(d.pos.x, d.pos.y, d.pos.z);
      scene.add(m);
    });

    // Cart Logic
    let cartCount = 0;
    let cartTotal = 0;
    let activeProduct = null;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      if(e.target.closest('.ui-sidebar') || e.target.closest('.cart-widget') || e.target.closest('.modal')) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(clickables);
      if (intersects.length > 0) {
        activeProduct = intersects[0].object.userData;
        document.getElementById('m-title').innerText = activeProduct.name;
        document.getElementById('m-desc').innerText = activeProduct.desc;
        document.getElementById('m-price').innerText = `قیمت: ${activeProduct.price},۰۰۰ تومان`;
        document.getElementById('prod-modal').style.display = 'block';
      }
    });

    function addToCart() {
      if(activeProduct) {
        cartCount++;
        cartTotal += activeProduct.price;
        document.getElementById('cart-count').innerText = cartCount;
        document.getElementById('cart-total').innerText = cartTotal;
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('prod-modal').style.display = 'none';
    }

    function focusHotspot(i) {
      const t = hotspotsData[i];
      camera.position.set(t.pos.x + 2, t.pos.y + 1.5, t.pos.z + 3);
      controls.target.set(t.pos.x, t.pos.y, t.pos.z);
    }

    let isTouring = false, angle = 0;
    function toggleTour() {
      isTouring = !isTouring;
      document.getElementById('tour-btn').innerText = isTouring ? "⏹ توقف تور" : "▶ تور خودکار ارائه";
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isTouring) {
        angle += 0.005;
        camera.position.x = Math.sin(angle) * 10;
        camera.position.z = Math.cos(angle) * 10 + 2;
        controls.target.set(0, 1, 0);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
