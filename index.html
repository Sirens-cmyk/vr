<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شبیه‌سازی ۳ بعدی فروشگاه - تحلیل رفتار مصرف‌کننده</title>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Vazirmatn Font -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050814;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* UI Sidebar Right - Compact & Minimal */
    .ui-sidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .ui-panel {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      color: #38bdf8;
    }
    .panel-header span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-icon {
      font-size: 9px;
      transition: transform 0.3s ease;
      color: #94a3b8;
    }
    .panel-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin-top 0.3s ease;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .ui-panel.open .panel-content {
      max-height: 260px;
      margin-top: 8px;
    }
    .ui-panel.open .toggle-icon {
      transform: rotate(180deg);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 6px 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }

    /* Hotspot Items in Drawer */
    .hotspot-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hotspot-item {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      cursor: pointer;
      font-size: 10.5px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hotspot-item:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
    }

    /* Floating Detailed Info Card */
    .info-card {
      position: absolute;
      bottom: 20px;
      right: 12px;
      z-index: 20;
      width: 270px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .info-card h3 {
      font-size: 12.5px;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-card p {
      font-size: 11px;
      color: #e2e8f0;
      line-height: 1.6;
    }
    .close-card {
      position: absolute;
      top: 8px;
      left: 10px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }
    .close-card:hover {
      color: #fff;
    }

    /* Floating Camera Reset Control (Bottom Left) */
    .view-controls {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }
    .btn-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
    }
    .btn-circle:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Minimal Sidebar Controls (Right Top) -->
  <div class="ui-sidebar">
    
    <!-- Title & Tour Panel -->
    <div class="ui-panel open">
      <div class="panel-header" onclick="togglePanel(this.parentElement)">
        <span><i class="fa-solid fa-store"></i> تحلیل رفتار مصرف‌کننده</span>
        <span class="toggle-icon"><i class="fa-solid fa-chevron-down"></i></span>
      </div>
      <div class="panel-content">
        <p style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">شبیه‌سازی عناصر بصری و چیدمان روانشناختی.</p>
        <button class="btn" id="tour-btn" onclick="toggleTour()">
          <i class="fa-solid fa-play" id="tour-icon"></i> <span id="tour-text">شروع تور خودکار ارائه</span>
        </button>
      </div>
    </div>

    <!-- Hotspot List Collapsible Panel -->
    <div class="ui-panel">
      <div class="panel-header" onclick="togglePanel(this.parentElement)">
        <span><i class="fa-solid fa-bullseye"></i> نقاط استراتژیک (Hotspots)</span>
        <span class="toggle-icon"><i class="fa-solid fa-chevron-down"></i></span>
      </div>
      <div class="panel-content">
        <ul class="hotspot-list">
          <li class="hotspot-item" onclick="focusHotspot(0)"><i class="fa-solid fa-door-open text-blue-400"></i> ۱. ورودی و خریدهای هیجانی</li>
          <li class="hotspot-item" onclick="focusHotspot(1)"><i class="fa-solid fa-eye text-emerald-400"></i> ۲. قفسه طلایی (سطح دید)</li>
          <li class="hotspot-item" onclick="focusHotspot(2)"><i class="fa-solid fa-tags text-amber-400"></i> ۳. بنرهای تخفیف بصری</li>
          <li class="hotspot-item" onclick="focusHotspot(3)"><i class="fa-solid fa-cash-register text-purple-400"></i> ۴. منطقه صندوق (خریدهای لحظه‌ای)</li>
        </ul>
      </div>
    </div>

  </div>

  <!-- Bottom Left Quick Actions -->
  <div class="view-controls">
    <button class="btn-circle" title="نمای ورودی" onclick="resetView()"><i class="fa-solid fa-house"></i></button>
    <button class="btn-circle" title="نورپردازی" onclick="toggleLighting()"><i class="fa-solid fa-lightbulb"></i></button>
  </div>

  <!-- Detailed Hotspot Card -->
  <div class="info-card" id="info-card">
    <button class="close-card" onclick="closeCard()"><i class="fa-solid fa-xmark"></i></button>
    <h3 id="card-title"><i class="fa-solid fa-circle-info"></i> عنوان نقطه</h3>
    <p id="card-desc">توضیحات تحلیلی مربوط به رفتار مصرف‌کننده در این بخش...</p>
  </div>

  <script>
    // --- 1. Three.js Core Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.025);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.5, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 2.5;
    controls.maxDistance = 20;

    // --- 2. Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
    mainLight.position.set(8, 14, 8);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    // --- 3. Build Store Environment ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.25 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 26), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(26, 26, 0x38bdf8, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // Shelves Constructor
    function createShelfUnit(x, z, highlightEyeLevel = false) {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4 });
      
      const leftSide = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 3.8), frameMat);
      leftSide.position.set(-1.4, 1.1, 0);
      group.add(leftSide);

      const rightSide = leftSide.clone();
      rightSide.position.set(1.4, 1.1, 0);
      group.add(rightSide);

      const colors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899];
      for (let i = 0; i < 4; i++) {
        const height = 0.3 + i * 0.55;
        const plank = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.06, 3.7), frameMat);
        plank.position.set(0, height, 0);
        group.add(plank);

        // Product Boxes
        for (let px = -1.1; px <= 1.1; px += 0.35) {
          for (let pz = -1.4; pz <= 1.4; pz += 0.45) {
            const pHeight = 0.2 + Math.random() * 0.12;
            const isEyeLevel = (i === 2);
            const pColor = (highlightEyeLevel && isEyeLevel) ? 0xfacc15 : colors[Math.floor(Math.random() * colors.length)];
            const prod = new THREE.Mesh(
              new THREE.BoxGeometry(0.22, pHeight, 0.26),
              new THREE.MeshStandardMaterial({ color: pColor, roughness: 0.3 })
            );
            prod.position.set(px, height + pHeight / 2 + 0.03, pz);
            prod.castShadow = true;
            group.add(prod);
          }
        }
      }
      group.position.set(x, 0, z);
      scene.add(group);
    }

    createShelfUnit(-4.5, -2);
    createShelfUnit(-4.5, 3);
    createShelfUnit(4.5, -2, true); // Gold Highlight Shelf
    createShelfUnit(4.5, 3);

    // Entrance Display Stand
    const entranceStand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.9, 1.1, 0.8, 16),
      new THREE.MeshStandardMaterial({ color: 0x2563eb })
    );
    entranceStand.position.set(0, 0.4, 8);
    scene.add(entranceStand);

    // Checkout Counter
    const counter = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 1.0, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x0f172a })
    );
    counter.position.set(0, 0.5, 5);
    scene.add(counter);

    // Promotional Banner (Red/Yellow Contrast)
    const banner = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 2.2, 3.5),
      new THREE.MeshStandardMaterial({ color: 0xdc2626 })
    );
    banner.position.set(-10.8, 3.2, -2);
    scene.add(banner);

    // --- 4. Interactive Hotspots ---
    const hotspotsData = [
      {
        pos: { x: 0, y: 1.2, z: 8 },
        title: "۱. منطقه خریدهای هیجانی (ورودی)",
        desc: "مشتری در ۵ ثانیه اول ورود در فاز «تطبیق بصری» است. استندهای رنگی در این نقطه، نرخ عبور به داخل فروشگاه و خرید هیجانی را تا ۳۵٪ افزایش می‌دهند."
      },
      {
        pos: { x: 3.2, y: 1.6, z: -2 },
        title: "۲. قفسه طلایی (سطح دید چشم)",
        desc: "ارتفاع ۱۲۰ تا ۱۶۰ سانتی‌متری قفسه بیشترین بازدهی اقتصادی را دارد. برندهای پر سود برای دیده شدن سریع در این سطح قرار می‌گیرند."
      },
      {
        pos: { x: -10.5, y: 3.2, z: -2 },
        title: "۳. بنرهای تخفیف بصری",
        desc: "تضاد رنگی تند (قرمز/زرد) توجه ناخودآگاه مغز را جلب کرده و حساسیت مشتری نسبت به قیمت کالاهای مجاور را کاهش می‌دهد."
      },
      {
        pos: { x: 0, y: 1.3, z: 5 },
        title: "۴. منطقه صندوق (خریدهای لحظه آخر)",
        desc: "در صف انتظار صندوق، خستگی تصمیم‌گیری رخ می‌دهد. چیدمان کالاهای کوچک و ارزان در این بخش سود کل فروشگاه را تا ۲۰٪ افزایش می‌دهد."
      }
    ];

    const hotspotGroup = [];
    hotspotsData.forEach((data, index) => {
      const g = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.22, 32),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
      );
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 })
      );
      g.add(ring);
      g.add(core);
      g.position.set(data.pos.x, data.pos.y, data.pos.z);
      g.userData = { index, ...data };
      scene.add(g);
      hotspotGroup.push(g);
    });

    // Raycaster for user click
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ui-sidebar') || e.target.closest('.info-card') || e.target.closest('.view-controls')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const clickable = [];
      hotspotGroup.forEach(h => h.traverse(c => clickable.push(c)));
      const intersects = raycaster.intersectObjects(clickable);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.title) obj = obj.parent;
        if (obj.userData && obj.userData.title) {
          focusHotspot(obj.userData.index);
        }
      }
    });

    // --- 5. Helper Functions ---
    function focusHotspot(index) {
      if (isTouring) toggleTour();
      const target = hotspotsData[index];
      showCard(target.title, target.desc);
      
      const endCam = { x: target.pos.x + 1.8, y: target.pos.y + 1.2, z: target.pos.z + 2.5 };
      smoothMoveCamera(endCam, target.pos);
    }

    function smoothMoveCamera(endCam, endTarget) {
      const startCam = camera.position.clone();
      const startTarget = controls.target.clone();
      let progress = 0;

      function anim() {
        progress += 0.04;
        const ease = 1 - Math.pow(1 - progress, 3);
        camera.position.lerpVectors(startCam, new THREE.Vector3(endCam.x, endCam.y, endCam.z), ease);
        controls.target.lerpVectors(startTarget, new THREE.Vector3(endTarget.x, endTarget.y, endTarget.z), ease);
        controls.update();
        if (progress < 1) requestAnimationFrame(anim);
      }
      anim();
    }

    function showCard(title, desc) {
      const card = document.getElementById('info-card');
      document.getElementById('card-title').innerHTML = `<i class="fa-solid fa-circle-info"></i> ${title}`;
      document.getElementById('card-desc').innerText = desc;
      card.style.display = 'block';
    }

    function closeCard() {
      document.getElementById('info-card').style.display = 'none';
    }

    function togglePanel(panel) {
      panel.classList.toggle('open');
    }

    function resetView() {
      if (isTouring) toggleTour();
      closeCard();
      smoothMoveCamera({ x: 0, y: 4.5, z: 13 }, { x: 0, y: 1, z: 0 });
    }

    let isWarm = false;
    function toggleLighting() {
      isWarm = !isWarm;
      ambientLight.color.setHex(isWarm ? 0xffedd5 : 0xffffff);
      mainLight.color.setHex(isWarm ? 0xfbbf24 : 0xffffff);
    }

    let isTouring = false, tourAngle = 0;
    function toggleTour() {
      isTouring = !isTouring;
      const text = document.getElementById('tour-text');
      const icon = document.getElementById('tour-icon');
      if (isTouring) {
        text.innerText = "توقف تور ارائه";
        icon.className = "fa-solid fa-pause";
      } else {
        text.innerText = "شروع تور خودکار ارائه";
        icon.className = "fa-solid fa-play";
      }
    }

    // --- 6. Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotate Hotspots
      hotspotGroup.forEach(h => {
        h.children[0].rotation.z += 0.02;
        h.lookAt(camera.position);
      });

      if (isTouring) {
        tourAngle += 0.004;
        camera.position.x = Math.sin(tourAngle) * 9;
        camera.position.z = Math.cos(tourAngle) * 9 + 2;
        camera.position.y = 3.8;
        controls.target.set(0, 1, 0);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
